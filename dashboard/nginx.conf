# Nginx configuration for the live dashboard
# This proxies API requests from the dashboard to the backend

server {
    listen 80;
    server_name localhost;

    # Serve static dashboard files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the FastAPI backend
    # The dashboard JavaScript calls /api/... which nginx forwards
    # to the api service on port 8000
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy WebSocket connections to the API
    location /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
